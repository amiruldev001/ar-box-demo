<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Komitmen Tracker</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f2f2f7;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      background-color: #fff;
      margin-top: 50px;
      width: 95%;
      max-width: 400px;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      font-weight: 600;
      color: #333;
    }

    .add-item {
      display: flex;
      margin-bottom: 20px;
    }

    .add-item input {
      flex: 1;
      padding: 10px 15px;
      border-radius: 15px;
      border: 1px solid #ccc;
      font-size: 16px;
      outline: none;
    }

    .add-item button {
      margin-left: 10px;
      padding: 10px 15px;
      border: none;
      background-color: #007aff;
      color: white;
      border-radius: 15px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
    }

    .add-item button:hover {
      background-color: #005bb5;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 15px;
      margin-bottom: 10px;
      background-color: #f9f9f9;
      border-radius: 15px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
    }

    li.completed {
      text-decoration: line-through;
      color: #999;
      background-color: #e0e0e0;
    }

    li button {
      background: none;
      border: none;
      color: #ff3b30;
      font-size: 18px;
      cursor: pointer;
      transition: 0.2s;
    }

    li button:hover {
      color: #b00020;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Komitmen</h1>

    <div class="add-item">
      <input type="text" id="newItem" placeholder="Add new komitmen">
      <button onclick="addItem()">Add</button>
    </div>

    <ul id="komitmenList"></ul>
  </div>

  <script>
    // Default list if no saved data
    const defaultKomitmen = [
      { text: "sayang 150", completed: false },
      { text: "api 57.90", completed: false },
      { text: "coway 70", completed: false },
      { text: "asb1 264", completed: false },
      { text: "mama 150", completed: false },
      { text: "ayah 150", completed: false },
      { text: "adik 50", completed: false },
      { text: "asb2 276", completed: false },
      { text: "air 11.05", completed: false },
      { text: "myvi 300", completed: false },
      { text: "yns 200", completed: false },
      { text: "Loan Rumah 1217", completed: false }
    ];

    const listEl = document.getElementById('komitmenList');

    // Load from localStorage or default
    let komitmen = JSON.parse(localStorage.getItem('komitmen')) || defaultKomitmen;

    function saveList() {
      localStorage.setItem('komitmen', JSON.stringify(komitmen));
    }

    function renderList() {
      listEl.innerHTML = '';
      komitmen.forEach((item, index) => {
        const li = document.createElement('li');
        li.className = item.completed ? 'completed' : '';
        li.innerHTML = `${item.text} <button onclick="deleteItem(event, ${index})">✕</button>`;
        li.onclick = () => toggleComplete(index);
        listEl.appendChild(li);
      });
    }

    function toggleComplete(index) {
      komitmen[index].completed = !komitmen[index].completed;
      saveList();
      renderList();
    }

    function deleteItem(event, index) {
      event.stopPropagation();
      komitmen.splice(index, 1);
      saveList();
      renderList();
    }

    function addItem() {
      const input = document.getElementById('newItem');
      const value = input.value.trim();
      if (value === '') return;

      komitmen.push({ text: value, completed: false });
      saveList();
      renderList();
      input.value = '';
    }

    // Initial render
    renderList();
  </script>
</body>
</html>
